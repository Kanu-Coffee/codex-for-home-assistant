---
name: Build app

"on":
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare
    if: github.repository == 'Kanu-Coffee/codex-for-home-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@f4ca6f671bd429efb108c0f2fa0ae8af0215986c
        with:
          path: "./${{ inputs.app }}"

      - name: Normalize app information
        id: normalize
        env:
          APP_DESCRIPTION: ${{ fromJSON(steps.info.outputs.description) }}
          APP_IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          APP_NAME: ${{ fromJSON(steps.info.outputs.name) }}
          APP_URL: ${{ fromJSON(steps.info.outputs.url) }}
          APP_VERSION: ${{ fromJSON(steps.info.outputs.version) }}
        run: |
          for variable in \
            APP_DESCRIPTION APP_IMAGE APP_NAME APP_URL APP_VERSION; do
            value="${!variable}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "App metadata must not contain newlines: ${variable}" >&2
              exit 1
            fi
          done

          {
            printf 'image_name=%s\n' "${APP_IMAGE##*/}"
            printf 'registry_prefix=%s\n' "${APP_IMAGE%/*}"
            printf 'version=%s\n' "$APP_VERSION"
            printf 'name=%s\n' "$APP_NAME"
            printf 'description=%s\n' "$APP_DESCRIPTION"
            if [[ -n "$APP_URL" && "$APP_URL" != "null" ]]; then
              printf 'url=%s\n' "$APP_URL"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        # yamllint disable-line rule:line-length
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image
        id: build-image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ github.token }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: false
          load: true
          cosign: false
          version: ${{ needs.prepare.outputs.version }}

      - name: Generate architecture SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: codex-for-home-assistant-${{ matrix.arch }}.spdx.json
          image: ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
          output-file: codex-for-home-assistant-${{ matrix.arch }}.spdx.json
          upload-release-assets: false

      - name: Enforce critical vulnerability gate
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: codex-for-home-assistant-${{ matrix.arch }}.spdx.json
          fail-build: true
          output-format: table
          severity-cutoff: critical

      - name: Report high and critical vulnerabilities (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: codex-for-home-assistant-${{ matrix.arch }}.spdx.json
          fail-build: false
          output-format: table
          severity-cutoff: high

      - name: Install Cosign
        if: inputs.publish
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR after vulnerability gates
        if: inputs.publish
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Push scanned architecture staging image and verify digest
        if: inputs.publish
        id: publish-image
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STAGING_TAG: ${{ needs.prepare.outputs.version }}-staging-${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          image_ref="${IMAGE}:${VERSION}"
          staging_ref="${IMAGE}:${STAGING_TAG}"
          docker tag "${image_ref}" "${staging_ref}"
          push_output="$(docker push "${staging_ref}" 2>&1)"
          printf '%s\n' "${push_output}"

          if [[ ! "${push_output}" =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then
            echo 'Staging push did not return an immutable digest' >&2
            exit 1
          fi
          staging_digest="${BASH_REMATCH[1]}"

          remote_digest=""
          for attempt in {1..5}; do
            remote_digest="$(docker buildx imagetools inspect \
              "${staging_ref}" \
              --format '{{json .Manifest}}' 2>/dev/null \
              | jq --raw-output '.digest' 2>/dev/null || true)"
            if [[ "${remote_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            if [[ "${attempt}" -lt 5 ]]; then
              sleep 2
            fi
          done

          if [[ "${remote_digest}" != "${staging_digest}" ]]; then
            echo 'Staging digest does not match the scanned image push' >&2
            exit 1
          fi

          printf '%s\n' "${staging_digest}" \
            > "${RUNNER_TEMP}/architecture-digest-${ARCHITECTURE}"
          chmod 0600 "${RUNNER_TEMP}/architecture-digest-${ARCHITECTURE}"
          echo "digest=${staging_digest}" >> "${GITHUB_OUTPUT}"

      - name: Preserve the verified architecture digest
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/architecture-digest-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Sign scanned architecture image digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.publish-image.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest architecture build provenance
        if: inputs.publish
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish-image.outputs.digest }}
          push-to-registry: true

      - name: Attest architecture SBOM
        if: inputs.publish
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish-image.outputs.digest }}
          sbom-path: codex-for-home-assistant-${{ matrix.arch }}.spdx.json
          push-to-registry: true

  manifest:
    name: Publish multi-arch manifest
    needs:
      - prepare
      - build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: architecture-digest-*
          path: architecture-digests
          merge-multiple: true

      - name: Log in to GHCR for manifest publication
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create staging manifest from verified architecture digests
        id: manifest-digest
        env:
          ARCHITECTURES: ${{ needs.prepare.outputs.architectures }}
          IMAGE: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          REGISTRY_PREFIX: ${{ needs.prepare.outputs.registry_prefix }}
          STAGING_TAG: ${{ needs.prepare.outputs.version }}-staging-${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          read_digest() {
            local digest_file=$1
            local -a digest_lines
            if [[ -L "${digest_file}" || ! -f "${digest_file}" ]]; then
              echo 'Verified architecture digest artifact is missing or unsafe' >&2
              exit 1
            fi
            mapfile -t digest_lines < "${digest_file}"
            if (( ${#digest_lines[@]} != 1 )) \
              || [[ ! "${digest_lines[0]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo 'Verified architecture digest artifact is invalid' >&2
              exit 1
            fi
            printf '%s' "${digest_lines[0]}"
          }

          if ! jq --exit-status \
            'type == "array" and length > 0
             and all(.[]; type == "string" and test("^[a-z0-9_]+$"))' \
            <<< "${ARCHITECTURES}" >/dev/null; then
            echo 'Architecture list is invalid' >&2
            exit 1
          fi

          sources=()
          expected_descriptors=()
          while IFS= read -r architecture; do
            architecture_image="${REGISTRY_PREFIX}/${architecture}-${IMAGE_NAME}"
            expected_digest="$(read_digest \
              "architecture-digests/architecture-digest-${architecture}")"
            case "${architecture}" in
              amd64) oci_architecture=amd64 ;;
              aarch64) oci_architecture=arm64 ;;
              *)
                echo 'Architecture has no supported OCI platform mapping' >&2
                exit 1
                ;;
            esac
            current_digest="$(docker buildx imagetools inspect \
              "${architecture_image}:${STAGING_TAG}" \
              --format '{{json .Manifest}}' | jq --raw-output '.digest')"
            if [[ "${current_digest}" != "${expected_digest}" ]]; then
              echo 'Architecture staging tag changed after verification' >&2
              exit 1
            fi
            sources+=("${architecture_image}@${expected_digest}")
            expected_descriptors+=(
              "${expected_digest}|${oci_architecture}|linux"
            )
          done < <(jq --raw-output '.[]' <<< "${ARCHITECTURES}")

          staging_ref="${IMAGE}:${STAGING_TAG}"
          docker buildx imagetools create --tag "${staging_ref}" \
            "${sources[@]}"

          staging_digest=$(docker buildx imagetools inspect \
            "${staging_ref}" \
            --format '{{json .Manifest}}' | jq --raw-output '.digest')
          if [[ ! "${staging_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Staging manifest did not return an immutable digest' >&2
            exit 1
          fi

          # Resolve the mutable staging tag once, then bind every validation
          # and all later trust evidence to those exact registry bytes.
          raw_manifest_file=$(mktemp)
          trap 'rm -f -- "${raw_manifest_file}"' EXIT
          docker buildx imagetools inspect \
            "${IMAGE}@${staging_digest}" --raw > "${raw_manifest_file}"
          calculated_digest="sha256:$(sha256sum "${raw_manifest_file}" \
            | cut -d ' ' -f 1)"
          if [[ "${calculated_digest}" != "${staging_digest}" ]]; then
            echo 'Staging manifest bytes do not match the resolved digest' >&2
            exit 1
          fi
          if ! jq --exit-status '
              .schemaVersion == 2
              and (.mediaType == "application/vnd.oci.image.index.v1+json"
                or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
              and (.manifests | type == "array")
              and all(.manifests[];
                (.digest | type == "string")
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
                and (.mediaType == "application/vnd.oci.image.manifest.v1+json"
                  or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
                and (.platform.os == "linux")
                and (.platform.architecture | type == "string"))
            ' "${raw_manifest_file}" >/dev/null; then
            echo 'Staging manifest schema or platform metadata is invalid' >&2
            exit 1
          fi
          mapfile -t actual_descriptors < <(jq --raw-output \
            '.manifests[]
             | "\(.digest)|\(.platform.architecture)|\(.platform.os)"' \
            "${raw_manifest_file}")
          if (( ${#actual_descriptors[@]} \
            != ${#expected_descriptors[@]} )); then
            echo 'Staging manifest architecture count is invalid' >&2
            exit 1
          fi
          mapfile -t sorted_actual < <(printf '%s\n' \
            "${actual_descriptors[@]}" | sort)
          mapfile -t sorted_expected < <(printf '%s\n' \
            "${expected_descriptors[@]}" | sort)
          for index in "${!sorted_expected[@]}"; do
            if [[ "${sorted_actual[${index}]}" \
              != "${sorted_expected[${index}]}" ]]; then
              echo 'Staging manifest contains an unverified architecture digest' >&2
              exit 1
            fi
          done
          rm -f -- "${raw_manifest_file}"
          trap - EXIT
          echo "digest=${staging_digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign multi-architecture manifest digest
        env:
          DIGEST: ${{ steps.manifest-digest.outputs.digest }}
          IMAGE: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest multi-architecture manifest provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}
          subject-digest: ${{ steps.manifest-digest.outputs.digest }}
          push-to-registry: true

      - name: Promote verified architecture and manifest tags
        env:
          ARCHITECTURES: ${{ needs.prepare.outputs.architectures }}
          IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
          REGISTRY_PREFIX: ${{ needs.prepare.outputs.registry_prefix }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -Eeuo pipefail

          promote() {
            local staging_ref=$1
            local final_ref=$2
            local expected_digest=$3
            local prefer_index=$4
            local existing_digest
            local existing_manifest
            local inspect_error

            inspect_error="$(mktemp)"
            if existing_manifest="$(docker buildx imagetools inspect \
              "${final_ref}" --format '{{json .Manifest}}' 2>"${inspect_error}")"; then
              existing_digest="$(jq --raw-output '.digest' \
                <<< "${existing_manifest}")"
              if [[ ! "${existing_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo 'Existing release tag returned an invalid digest' >&2
                exit 1
              fi
              if [[ "${existing_digest}" != "${expected_digest}" ]]; then
                echo 'Refusing to overwrite a release tag with different content' >&2
                exit 1
              fi
            elif grep -Eiq 'manifest unknown|not found' "${inspect_error}"; then
              if [[ "${prefer_index}" == false ]]; then
                docker buildx imagetools create --prefer-index=false \
                  --tag "${final_ref}" "${staging_ref}@${expected_digest}"
              else
                docker buildx imagetools create \
                  --tag "${final_ref}" "${staging_ref}@${expected_digest}"
              fi
            else
              cat "${inspect_error}" >&2
              exit 1
            fi
            rm -f "${inspect_error}"

            existing_digest="$(docker buildx imagetools inspect \
              "${final_ref}" --format '{{json .Manifest}}' \
              | jq --raw-output '.digest')"
            if [[ "${existing_digest}" != "${expected_digest}" ]]; then
              echo 'Promoted release tag does not match its verified digest' >&2
              exit 1
            fi
          }

          while IFS= read -r architecture; do
            architecture_image="${REGISTRY_PREFIX}/${architecture}-${IMAGE_NAME}"
            architecture_digest="$(< \
              "architecture-digests/architecture-digest-${architecture}")"
            if [[ ! "${architecture_digest}" \
              =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo 'Verified architecture digest artifact is invalid' >&2
              exit 1
            fi
            promote "${architecture_image}" \
              "${architecture_image}:${VERSION}" \
              "${architecture_digest}" false
          done < <(jq --raw-output '.[]' <<< "${ARCHITECTURES}")

          manifest_image="${REGISTRY_PREFIX}/${IMAGE_NAME}"
          promote "${manifest_image}" \
            "${manifest_image}:${VERSION}" \
            "${{ steps.manifest-digest.outputs.digest }}" true
