---
name: Builder

"on":
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/build-app.yaml"
      - ".github/workflows/builder.yaml"
      - "codex_home_assistant/**"
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ fromJSON(steps.info.outputs.version) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@f4ca6f671bd429efb108c0f2fa0ae8af0215986c
        with:
          path: ./codex_home_assistant

      - name: Validate image and release tag
        env:
          APP_DESCRIPTION: ${{ fromJSON(steps.info.outputs.description) }}
          APP_IMAGE: ${{ fromJSON(steps.info.outputs.image) }}
          APP_NAME: ${{ fromJSON(steps.info.outputs.name) }}
          APP_VERSION: ${{ fromJSON(steps.info.outputs.version) }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_image="ghcr.io/kanu-coffee/codex-for-home-assistant"
          if [[ "${APP_IMAGE}" != "${expected_image}" ]]; then
            echo "Unexpected image: ${APP_IMAGE}" >&2
            exit 1
          fi

          if [[ ! "${APP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[1-9][0-9]*)?$ ]]; then
            echo "App version must be X.Y.Z or a numbered X.Y.Z-dev.N build" >&2
            exit 1
          fi

          if [[ "${APP_VERSION}" =~ -dev\.[1-9][0-9]*$ ]]; then
            expected_name="Codex for Home Assistant (DEV)"
            expected_repository_name="name: Codex for Home Assistant (DEV)"
            expected_panel_title="panel_title: Codex DEV"
            expected_stage="experimental"
            expected_oci_title='  org.opencontainers.image.title="Home Assistant App: Codex for Home Assistant (DEV)"'
            expected_oci_description='  org.opencontainers.image.description="Development build of Codex CLI, '
            expected_oci_description+='verified feedback reports, Playwright browser, Ingress terminal, '
            expected_oci_description+='and public-key SSH for Home Assistant"'
            expected_motd="Codex for Home Assistant (DEV)"
            if [[ "${APP_DESCRIPTION}" != "[DEV] "* ]]; then
              echo "DEV App description must start with [DEV]" >&2
              exit 1
            fi
          else
            expected_name="Codex for Home Assistant"
            expected_repository_name="name: Codex for Home Assistant"
            expected_panel_title="panel_title: Codex"
            expected_stage=""
            expected_oci_title='  org.opencontainers.image.title="Home Assistant App: Codex for Home Assistant"'
            expected_oci_description='  org.opencontainers.image.description="Codex CLI with verified feedback '
            expected_oci_description+='reports, Playwright browser, Ingress terminal, and public-key SSH '
            expected_oci_description+='for Home Assistant"'
            expected_motd="Codex for Home Assistant"
            if [[ "${APP_DESCRIPTION}" == "[DEV] "* ]]; then
              echo "Stable App description must not start with [DEV]" >&2
              exit 1
            fi
          fi
          if [[ "${APP_NAME}" != "${expected_name}" ]]; then
            echo "App name does not match the release channel" >&2
            exit 1
          fi
          if [[ "$(grep --count '^name:' repository.yaml)" -ne 1 ]] \
            || ! grep --fixed-strings --line-regexp --quiet \
              "${expected_repository_name}" repository.yaml; then
            echo "Repository name does not match the release channel" >&2
            exit 1
          fi
          if [[ "$(grep --count '^panel_title:' codex_home_assistant/config.yaml)" -ne 1 ]] \
            || ! grep --fixed-strings --line-regexp --quiet \
              "${expected_panel_title}" codex_home_assistant/config.yaml; then
            echo "Panel title does not match the release channel" >&2
            exit 1
          fi
          if [[ -n "${expected_stage}" ]]; then
            if [[ "$(grep --count '^stage:' codex_home_assistant/config.yaml)" -ne 1 ]] \
              || ! grep --fixed-strings --line-regexp --quiet \
                "stage: ${expected_stage}" codex_home_assistant/config.yaml; then
              echo "App stage does not match the release channel" >&2
              exit 1
            fi
          elif grep --quiet '^stage:' codex_home_assistant/config.yaml; then
            echo "Stable App must use the implicit stable stage" >&2
            exit 1
          fi
          if [[ "$(grep --count 'org.opencontainers.image.title=' codex_home_assistant/Dockerfile)" -ne 1 ]] \
            || ! grep --fixed-strings --line-regexp --quiet \
              "${expected_oci_title} \\" codex_home_assistant/Dockerfile; then
            echo "OCI title does not match the release channel" >&2
            exit 1
          fi
          if [[ "$(grep --count 'org.opencontainers.image.description=' codex_home_assistant/Dockerfile)" -ne 1 ]] \
            || ! grep --fixed-strings --line-regexp --quiet \
              "${expected_oci_description} \\" codex_home_assistant/Dockerfile; then
            echo "OCI description does not match the release channel" >&2
            exit 1
          fi
          IFS= read -r motd_title < codex_home_assistant/rootfs/etc/motd
          if [[ "${motd_title}" != "${expected_motd}" ]]; then
            echo "MOTD title does not match the release channel" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[1-9][0-9]*)?$ ]]; then
              echo "Release tag must be X.Y.Z or a numbered X.Y.Z-dev.N build" >&2
              exit 1
            fi
            if [[ "${RELEASE_TAG}" != "${APP_VERSION}" ]]; then
              echo "Release tag and App version differ" >&2
              exit 1
            fi
          fi

  build-app:
    name: Build codex_home_assistant without publishing
    if: github.event_name == 'pull_request'
    needs: validate
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-app.yaml
    with:
      app: codex_home_assistant
      publish: false

  publish-app:
    name: Build and publish codex_home_assistant
    if: github.event_name == 'push'
    needs: validate
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: codex_home_assistant
      publish: true
